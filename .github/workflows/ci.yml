name: CI

on:
  push:
    branches: [main, desktop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # macOS 26 runner 的 dyld 强制要求二进制含 LC_UUID，
          # Go >=1.23 的链接器才会生成，1.22 的测试二进制会被直接杀掉。
          go-version: "1.23"
          cache: true

      - name: 静态检查
        run: go vet ./...

      - name: 运行测试
        run: go test -count=1 ./...

  build:
    name: 构建 .app
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: 构建
        run: ./build.sh

      - name: 打 zip
        run: ditto -c -k --sequesterRsrc --keepParent build/ssh-tunnel.app build/ssh-tunnel-app.zip

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ssh-tunnel-app
          path: build/ssh-tunnel-app.zip
          if-no-files-found: error