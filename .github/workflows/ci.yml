name: CI

on:
  push:
    branches: [main, desktop]
  pull_request:

jobs:
  test:
    name: 测试
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: 静态检查
        run: go vet ./...

      - name: 运行测试
        run: go test ./...

  build:
    name: 构建 .app
    needs: test
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: 构建
        run: ./build.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ssh-tunnel-app
          path: build/ssh-tunnel.app
          if-no-files-found: error