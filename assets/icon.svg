<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    ssh-tunnel 应用图标。
    构图：圆角方形底 + 居中的侧视隧道 + 一支横穿隧道的箭头。
    箭头用琥珀色而非白色：它要依次压过蓝色底、白色拱环、深色腔体三种颜色，
    只有琥珀色对三者都有对比，因此不需要额外描边，小尺寸下也不会糊成一团。
    图形主体限制在 100..924，四周留白留给 macOS 的投影。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E6EF2"/>
      <stop offset="0.55" stop-color="#1179CC"/>
      <stop offset="1" stop-color="#0FBCA6"/>
    </linearGradient>

    <!-- 顶部一层很淡的高光，避免大色块发死 -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- 隧道内腔：越往里越暗，制造纵深 -->
    <radialGradient id="depth" cx="0.5" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#0C2C62"/>
      <stop offset="1" stop-color="#040F27"/>
    </radialGradient>

    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD36B"/>
      <stop offset="1" stop-color="#FFA92E"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24"
                    flood-color="#04143A" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#gloss)"/>
  </g>

  <!-- 隧道：白色拱体，居中，坐在下方的地面线上 -->
  <path d="M264 782 L264 512 A248 248 0 0 1 760 512 L760 782 Z" fill="#FFFFFF"/>
  <!-- 内腔挖空，白色于是成为一道均匀的拱形环 -->
  <path d="M346 782 L346 512 A166 166 0 0 1 678 512 L678 782 Z" fill="url(#depth)"/>

  <!-- 地面：让隧道有立足点，而不是悬空 -->
  <rect x="196" y="782" width="632" height="32" rx="16" fill="#FFFFFF" opacity="0.9"/>

  <!-- 横穿隧道的箭头，垂直居中于腔体 -->
  <path d="M168 606 L676 606 L676 528 L872 648 L676 768 L676 690 L168 690 Z"
        fill="url(#arrow)"/>
</svg>
