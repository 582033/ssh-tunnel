<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    ssh-tunnel 应用图标（扁平版）。
    构图：macOS 式圆角方底 + 居中的隧道口 + 一支横穿隧道的箭头。
    扁平的取舍：全部实心色块，不用渐变、高光、投影——小尺寸（32px 以下）
    时渐变只会糊成一团，实心块才立得住。
    配色对比是设计过的：箭头要依次压过蓝底、白色拱环、深蓝腔体三种颜色，
    只有琥珀色对三者都有足够对比，因此不需要额外描边。
    图形主体限制在 100..924，四周留白留给 macOS 的投影。
  -->
  <!-- 底：实心品牌蓝，圆角 184（824 的 22.3%，与 macOS 图标比例一致） -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="#2E7DD1"/>

  <!-- 隧道：白色拱体；内腔挖深蓝，白色于是成了一道均匀的拱形环 -->
  <path d="M262 800 L262 510 A250 250 0 0 1 762 510 L762 800 Z" fill="#FFFFFF"/>
  <path d="M346 800 L346 510 A166 166 0 0 1 678 510 L678 800 Z" fill="#12294D"/>

  <!-- 横穿隧道的箭头：垂直居中于腔体 -->
  <path d="M180 528 L668 528 L668 470 L880 572 L668 674 L668 616 L180 616 Z" fill="#FFB43D"/>
</svg>
